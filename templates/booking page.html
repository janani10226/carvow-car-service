<!DOCTYPE html>
<html>
<head>
    <title>Service booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('../pictures/emob_bev_stage_range_dsk_fb (1).webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: #f5f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(18, 22, 26, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffcc00;
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-top: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(18, 22, 26, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        input[type="text"],
        input[type="date"],
        input[type="time"],
        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        select:focus {
            outline: none;
            border-color: #ffcc00;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.15);
        }
        option {
            background-color: #1e242c;
            color: #ffffff;
        }
        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #0d0f12;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        button[type="submit"]:hover {
            background: linear-gradient(135deg, #ffdd33, #ffaa00);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .back-link:hover {
            color: #ffcc00;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(18, 22, 26, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 50px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <h1>CARVOW</h1>
    </header>
    <div class="main-content" style="flex-direction: column;">
        <h2>SERVICE BOOKING</h2>
        <div class="container">
            <form action="/book" method="POST" onsubmit="return handleBooking(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Car Model</label>
                    <input type="text" name="car" required>
                </div>
                <div class="form-group">
                    <label>Service Type</label>
                    <select name="service">
                        <option>Oil Change</option>
                        <option>Car Wash</option>
                        <option>Engine Service</option>
                        <option>Full Service</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Appointment Date</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>Appointment Time</label>
                    <input type="time" name="time" required>
                </div>
                <button type="submit">BOOK Appointment</button>
                <a href="appointment login.html" class="back-link">Back to Home</a>
            </form>
        </div>
    </div>

    <script>
    function handleBooking(event) {
        if (window.location.protocol === 'file:') {
            let currentUser = JSON.parse(localStorage.getItem('currentUser')) || { email: 'guest@carvow.com' };
            
            let name = document.querySelector('input[name="name"]').value;
            let phone = document.querySelector('input[name="phone"]').value;
            let car = document.querySelector('input[name="car"]').value;
            let service = document.querySelector('select[name="service"]').value;
            let date = document.querySelector('input[name="date"]').value;
            let time = document.querySelector('input[name="time"]').value;

            let appointments = JSON.parse(localStorage.getItem('appointments')) || [];
            let newId = appointments.length + 1;
            appointments.push({
                id: newId,
                name: name,
                phone: phone,
                car: car,
                service: service,
                date: date,
                time: time,
                user_email: currentUser.email
            });
            localStorage.setItem('appointments', JSON.stringify(appointments));

            alert("Booking appointment submitted successfully!");
            window.location.href = "sucess.html";
            return false;
        }
        return true;
    }
    </script>
    <footer>
        <p>© 2026 Janani. All rights reserved.</p>
    </footer>
</body>
</html>
