<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Carvow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0d10;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 204, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(239, 68, 68, 0.05) 0px, transparent 50%);
            color: #f5f6f8;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 420px;
            width: 90%;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            text-align: center;
        }

        .admin-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #ffcc00;
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 8px 0 30px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 22px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
        }

        input[type="email"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #ffcc00;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #0d0f12;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button:hover {
            background: linear-gradient(135deg, #ffdd33, #ffaa00);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #cbd5e1;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 16px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-icon">🔐</div>
        <h1>CARVOW ADMIN</h1>
        <p class="subtitle">Management Portal Sign In</p>

        <!-- Dynamic Error Banner (Flask + JS fallback) -->
        <div id="jsErrorBanner" class="error-banner" style="{% if error %}display: block;{% else %}display: none;{% endif %}">
            <span id="errorText">{% if error %}{{ error }}{% endif %}</span>
        </div>

        <form action="/admin/login" method="POST" onsubmit="return handleAdminLogin(event)">
            <div class="form-group">
                <label>Admin Email Address</label>
                <input type="email" name="email" id="adminEmail" placeholder="admin@carvow.com" required value="{{ email if email else 'carvowservice@gmail.com' }}">
            </div>
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" name="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>
            <button type="submit">Access Control Center</button>
        </form>
        <a href="appointment login.html" class="back-link">Return to Public Homepage</a>
    </div>

    <script>
    function handleAdminLogin(event) {
        const errorBanner = document.getElementById('jsErrorBanner');
        const errorText = document.getElementById('errorText');
        
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;

        if (window.location.protocol === 'file:') {
            if (email === 'carvowservice@gmail.com' && password === 'admin123') {
                localStorage.setItem('adminSession', JSON.stringify({ email: email, isAdmin: true }));
                errorBanner.style.display = 'none';
                alert("Admin login successful!");
                window.location.href = "admin.html";
                return false;
            } else {
                errorBanner.style.display = 'block';
                errorText.innerText = '⚠️ Invalid Admin Credentials! (Offline Default Password: admin123)';
                event.preventDefault();
                return false;
            }
        }
        return true;
    }
    </script>

    <footer>
        <p>© 2026 Carvow Service Management. Restricted Access.</p>
    </footer>
</body>
</html>
