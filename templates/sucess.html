<html>
<head>
    <title>Booking Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0f12;
            color: #f5f6f8;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 450px;
            width: 90%;
            background: rgba(18, 22, 26, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #ffcc00;
            font-weight: 700;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-direction: column;
        }
        @media (min-width: 400px) {
            .btn-group {
                flex-direction: row;
            }
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #0d0f12;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #ffdd33, #ffaa00);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-message">
        <h2>✅ Appointment Confirmed!</h2>
        <p>Thank you for booking with Carvow Car Service.</p>
        <p>Your service appointment has been scheduled successfully.</p>
    </div>
    <div class="btn-group">
        <a href="appointment login.html" class="btn btn-secondary">Home</a>
        <a href="history.html" class="btn">View History</a>
    </div>
</div>
</body>
</html>
