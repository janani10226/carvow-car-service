<HTML>
<head>
    <title>LOGIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('../pictures/hybrid-cars.thumb.800.480.avif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: #f5f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 450px;
            width: 90%;
            background: rgba(18, 22, 26, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-top: 0;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 2rem;
            color: #ffcc00;
        }
        h2 {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
            flex-direction: column;
        }
        @media (min-width: 400px) {
            .btn-group {
                flex-direction: row;
            }
        }
        button {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #0d0f12;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: 100%;
        }
        button:hover {
            background: linear-gradient(135deg, #ffdd33, #ffaa00);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }
        .home-link {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
            transition: color 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .home-link:hover {
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(18, 22, 26, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #64748b;
            position: fixed;
            bottom: 0;
            width: 100%;
            left: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<BODY>
    <div class="container">
        <h1>CARVOW</h1>
        <h2>Appointment Booking Gateway</h2>
        <div class="btn-group">
            <a href="LOGIN PAGE.html" style="flex: 1; text-decoration: none;"><button>LOGIN</button></a>
            <a href="Sign up page.html" style="flex: 1; text-decoration: none;"><button>SIGN UP</button></a>
        </div>
        <a href="appointment login.html" class="home-link">Back to Home</a>
    </div>
    <footer>
        <p>© 2026 Janani. All rights reserved.</p>
    </footer>
</BODY>
</HTML>
