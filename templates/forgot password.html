<HTML>
<head>
    <title>RESET PASSWORD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url('../pictures/istockphoto-1397917805-612x612.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 400px;
            width: 90%;
            margin: 60px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        h2 {
            text-align: center;
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid gray;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #ffcc00;
            color: black;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        input[type="submit"]:hover {
            background-color: black;
            color: white;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .back-link:hover {
            color: #ffcc00;
        }
        footer {
            text-align: center;
            padding: 15px;
            background: black;
            color: whitesmoke;
            margin-top: 50px;
        }
    </style>
</head>
<BODY>
    <div class="container">
        <h1>CARVOW</h1>
        <h2>RESET YOUR PASSWORD</h2>
        <form action="/forgot password.html" method="POST" onsubmit="return validateForm()">
            <div class="form-group">
                <label>EMAIL ID</label>
                <input type="email" id="email" name="email" placeholder="Enter Registered Email" required>
            </div>
            <div class="form-group">
                <label>NEW PASSWORD</label>
                <input type="password" id="password" name="password" placeholder="Enter New Password" required>
            </div>
            <input type="submit" value="Reset Password">
            <a href="LOGIN PAGE.html" class="back-link">Back to Login</a>
        </form>
    </div>

    <script>
    function validateForm() {
        let email = document.getElementById("email").value.trim().toLowerCase();
        let password = document.getElementById("password").value;

        if (!email.includes("@") || !email.includes(".")) {
            alert("Enter valid Email ID");
            return false;
        }

        if (password.length < 6) {
            alert("Enter minimum 6 characters");
            return false;
        }

        if (!/[A-Z]/.test(password)) {
            alert("Use at least one uppercase letter");
            return false;
        }

        if (!/[!@#$%^&*]/.test(password)) {
            alert("Use at least one special symbol");
            return false;
        }

        if (window.location.protocol === 'file:') {
            let localUsers = [];
            try {
                localUsers = JSON.parse(localStorage.getItem('users')) || [];
                if (!Array.isArray(localUsers)) localUsers = [];
            } catch (e) {
                localUsers = [];
            }
            let userIndex = localUsers.findIndex(u => u.email.toLowerCase() === email);
            if (userIndex === -1) {
                alert("Email is not registered!");
                return false;
            }
            localUsers[userIndex].password = password;
            localStorage.setItem('users', JSON.stringify(localUsers));
            localStorage.setItem('currentUser', JSON.stringify({ email: email }));

            alert("Password reset successfully!");
            window.location.href = "booking page.html";
            return false;
        }

        return true;
    }

    // Display error alert from Flask server if present
    const serverError = "{{ error }}";
    if (serverError && !serverError.startsWith("{" + "{" + " error")) {
        alert(serverError);
    }
    </script>
    <footer>
        <p>© 2026 Janani. All rights reserved.</p>
    </footer>
</BODY>
</HTML>
