<HTML>
<head>
    <title>LOGIN PAGE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('../pictures/istockphoto-1397917805-612x612.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            color: #f5f6f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 450px;
            width: 90%;
            background: rgba(18, 22, 26, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 2rem;
            color: #ffcc00;
        }
        h2 {
            text-align: center;
            color: #cbd5e1;
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffcc00;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.15);
        }
        input[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #0d0f12;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        input[type="submit"]:hover {
            background: linear-gradient(135deg, #ffdd33, #ffaa00);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.5);
        }
        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .footer-links a {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .footer-links a:hover {
            color: #ffcc00;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(18, 22, 26, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 50px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<BODY>
    <div class="container">
        <h1>CARVOW</h1>
        <form action="/LOGIN PAGE.html" method="POST" onsubmit="return validateForm()">
            <div class="form-group">
                <label>EMAIL ID</label>
                <input type="email" id="email" name="email" placeholder="Enter Email" required>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>
            <input type="submit" value="Submit">
            <div class="footer-links">
                <a href="LOGIN.html">Back</a>
                <a href="forgot password.html">Forgot Password?</a>
            </div>
        </form>
    </div>

    <script>
    function validateForm() {
        let email = document.getElementById("email").value.trim().toLowerCase();
        let password = document.getElementById("password").value;

        if (!email.includes("@") || !email.includes(".")) {
            alert("Enter valid Email ID");
            return false;
        }

        if (password.length === 0) {
            alert("Enter password");
            return false;
        }

        if (window.location.protocol === 'file:') {
            let localUsers = [];
            try {
                localUsers = JSON.parse(localStorage.getItem('users')) || [];
                if (!Array.isArray(localUsers)) localUsers = [];
            } catch (e) {
                localUsers = [];
            }
            let user = localUsers.find(u => u.email.toLowerCase() === email && u.password === password);
            if (!user) {
                alert("Invalid Email or Password!");
                return false;
            }
            localStorage.setItem('currentUser', JSON.stringify({ email: email }));

            alert("logined successfully");
            window.location.href = "booking page.html";
            return false;
        }

        return true;
    }

    // Display error alert from Flask server if present
    const serverError = "{{ error }}";
    if (serverError && !serverError.startsWith("{" + "{" + " error")) {
        alert(serverError);
    }
    </script>
    <footer>
        <p>© 2026 Janani. All rights reserved.</p>
    </footer>
</BODY>
</HTML>
